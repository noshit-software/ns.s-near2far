server {
    listen 80;

    # Backend caps photo uploads at 5MB — nginx's own 1MB default would otherwise reject
    # the request before it gets there, with an HTML error page the frontend can't parse.
    client_max_body_size 6M;

    # A static `proxy_pass http://backend:8000` resolves the "backend" hostname once, at
    # config load, and nginx refuses to start at all if it can't be resolved right then
    # (`host not found in upstream`) — which took the whole dashboard container down when the
    # docker-compose "backend" service happened to not be up at that exact moment (in
    # production, the VPS's own system nginx actually fronts /api directly to a bare pm2
    # process — this container's own /api proxying is only exercised in the plain
    # `docker compose up` local/dev stack). Routing through a variable instead defers DNS
    # resolution to request time via the embedded Docker resolver, so a missing/unhealthy
    # backend container just 502s the (unused, in prod) /api requests instead of crash-looping
    # the entire dashboard.
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # The hashed asset filenames (assets/index-<hash>.js/.css) are safe to cache forever —
    # the hash changes on every build. index.html itself must never be cached, or a browser
    # can keep serving a stale page shell (with old asset references) indefinitely after a
    # deploy, even past a hard refresh in some cases.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    # The WebSocket handshake carries the admin password as a ?token= query param (browsers
    # can't send custom headers during the initial WS upgrade), and /api/traccar/forward
    # optionally carries TRACCAR_FORWARD_TOKEN the same way — nginx's default access log
    # records the full request line including the query string, which would otherwise write
    # both plaintext secrets into container logs on every single request. Neither location
    # needs its own request logged (the app doesn't rely on nginx's access log for anything).
    location /api/traccar/forward {
        access_log off;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    location /uploads {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
    }

    location /ws {
        access_log off;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
