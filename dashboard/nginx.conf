server {
    listen 80;

    # Backend caps photo uploads at 5MB — nginx's own 1MB default would otherwise reject
    # the request before it gets there, with an HTML error page the frontend can't parse.
    client_max_body_size 6M;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # The hashed asset filenames (assets/index-<hash>.js/.css) are safe to cache forever —
    # the hash changes on every build. index.html itself must never be cached, or a browser
    # can keep serving a stale page shell (with old asset references) indefinitely after a
    # deploy, even past a hard refresh in some cases.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api {
        proxy_pass http://backend:8000;
    }

    location /uploads {
        proxy_pass http://backend:8000;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
