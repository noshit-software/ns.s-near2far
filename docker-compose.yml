services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:8000"
    env_file: .env
    environment:
      # Overrides .env's own POSTGRES_HOST — that file's value is 127.0.0.1 (correct for the
      # VPS's bare pm2-run backend, which isn't on this Docker network at all), but a backend
      # running *in* this compose stack reaches Postgres via the "db" service name instead.
      # `environment:` here takes priority over the same key in env_file, so this is the one
      # and only place this differs — not a second .env file that can silently drift.
      POSTGRES_HOST: db
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT}:80"
    depends_on:
      - backend
    networks: [app-net]
    restart: unless-stopped

  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # localhost-only, so a host-run backend (pm2, no docker) can reach it.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-net]
    restart: unless-stopped

  traccar:
    # Opt-in example, not part of the default stack — OwnTracks (see README "GPS setup") is the
    # recommended GPS source for every platform now, and doesn't need a separate service running
    # at all. `docker compose up -d` alone never starts this; explicitly request it with
    # `docker compose --profile traccar up -d` if you actually want Traccar/Traccar Client.
    profiles: ["traccar"]
    # Pinned rather than :latest — an unpinned tag means every `docker compose pull`/rebuild
    # can silently change what's running, with no way to know what changed. This is the exact
    # version already deployed as of 2026-08 (from the image's own
    # org.opencontainers.image.version label) — pinning it is a no-op today, just removes the
    # silent-drift risk going forward. Bump deliberately when there's a reason to.
    image: traccar/traccar:6.14.5
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      FORWARD_URL: ${TRACCAR_FORWARD_URL}
      FORWARD_TYPE: json
    ports:
      # web UI + REST API — localhost-only; reached publicly via an nginx
      # reverse proxy (see README) instead of exposing this port directly.
      - "127.0.0.1:8082:8082"
      - "5055:5055/udp" # OsmAnd protocol, used by the Traccar Client phone app
      - "5055:5055/tcp"
    volumes:
      - traccar_data:/opt/traccar/data
    extra_hosts:
      # Lets TRACCAR_FORWARD_URL target a host-run backend (pm2 on the VPS,
      # not this compose file's `backend` service) via host.docker.internal.
      - "host.docker.internal:host-gateway"
    networks: [app-net]
    restart: unless-stopped

volumes:
  pg_data:
  traccar_data:
  backend_uploads:

networks:
  app-net:
    driver: bridge
