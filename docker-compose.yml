services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT}:80"
    depends_on:
      - backend
    networks: [app-net]
    restart: unless-stopped

  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-net]
    restart: unless-stopped

  traccar:
    image: traccar/traccar:latest
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      FORWARD_URL: ${TRACCAR_FORWARD_URL}
      FORWARD_TYPE: json
    ports:
      # web UI + REST API — localhost-only; reached publicly via an nginx
      # reverse proxy (see README) instead of exposing this port directly.
      - "127.0.0.1:8082:8082"
      - "5055:5055/udp" # OsmAnd protocol, used by the Traccar Client phone app
      - "5055:5055/tcp"
    volumes:
      - traccar_data:/opt/traccar/data
    extra_hosts:
      # Lets TRACCAR_FORWARD_URL target a host-run backend (pm2 on the VPS,
      # not this compose file's `backend` service) via host.docker.internal.
      - "host.docker.internal:host-gateway"
    networks: [app-net]
    restart: unless-stopped

volumes:
  pg_data:
  traccar_data:

networks:
  app-net:
    driver: bridge
