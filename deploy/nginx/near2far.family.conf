# Copy to /etc/nginx/sites-available/near2far.conf, symlink into sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Assumes: dashboard built (`npm run build` in dashboard/, producing dashboard/dist),
# backend running via pm2 (ecosystem.config.js) on 127.0.0.1:5101. Cloudflare
# terminates TLS (proxied orange-cloud) — origin stays plain HTTP, same pattern as
# the other noshit.software services on this box.

server {
    listen 80;
    server_name near2far.family;

    root /home/rgardunia/ns.s-bear2far/dashboard/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
        proxy_pass http://127.0.0.1:5101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
